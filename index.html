<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Consolas,monospace}
:root{--bg:#0b0f1a;--panel:#131a2b;--line:#24304d;--grn:#34d399;--red:#f87171;--ylw:#fbbf24;--blu:#60a5fa;--txt:#dbe4f3;--mut:#8b98b8}
body{background:var(--bg);color:var(--txt)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-size:22px;font-weight:900;color:var(--grn)}
.logo small{display:block;font-size:11px;color:var(--mut);font-weight:400}
header select{margin-left:auto;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:7px 10px;font-size:13px}
.tabs{display:flex;gap:8px;padding:14px 20px 0}
.tabs button{flex:1;max-width:320px;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-bottom:none;padding:12px;border-radius:12px 12px 0 0;cursor:pointer;font-weight:800;font-size:14px}
.tabs button.on{background:#1a2340;color:var(--grn)}
main{max-width:1000px;margin:0 auto;padding:18px 15px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:0 14px 14px 14px;padding:22px;display:none}
.panel.on{display:block}
.panel h2{color:var(--grn);margin-bottom:6px;font-size:20px}
.panel p.sub{color:var(--mut);font-size:13.5px;margin-bottom:14px;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input[type=text],textarea,select{background:#0b0f1a;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 14px;font-size:13.5px;outline:none}
input[type=text]{flex:1;min-width:200px;direction:ltr}
textarea{width:100%;min-height:220px;font-family:Consolas,monospace;font-size:12.5px;direction:ltr}
button.go{background:var(--grn);color:#06281c;border:none;padding:11px 24px;border-radius:10px;font-weight:900;cursor:pointer;font-size:14px}
button.alt{background:transparent;color:var(--blu);border:1px solid var(--blu);padding:10px 18px;border-radius:10px;cursor:pointer;font-size:13px}
button.go:hover{filter:brightness(1.1)}
.note{background:#1a2340;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--mut);margin:10px 0;line-height:1.7}
.note b{color:var(--ylw)}
.grade{display:flex;align-items:center;gap:16px;margin:16px 0;flex-wrap:wrap}
.badge{font-size:44px;font-weight:900;width:96px;height:96px;border-radius:20px;display:flex;align-items:center;justify-content:center;border:3px solid}
.gA{color:var(--grn);border-color:var(--grn)} .gB{color:var(--blu);border-color:var(--blu)} .gC{color:var(--ylw);border-color:var(--ylw)} .gF{color:var(--red);border-color:var(--red)}
.check{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:13.5px}
.check .hd{display:flex;gap:10px;align-items:center;font-weight:800}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.p{background:var(--grn)} .w{background:var(--ylw)} .f{background:var(--red)}
.check small{color:var(--mut);display:block;margin-top:4px;line-height:1.6}
.check code{display:block;background:#0b0f1a;border-radius:8px;padding:8px;margin-top:6px;font-size:12px;color:var(--grn);direction:ltr;text-align:left;white-space:pre-wrap}
.find{border-left:4px solid;padding:12px 14px;margin:8px 0;background:#0b0f1a;border-radius:0 10px 10px 0;font-size:13px}
.find.high{border-color:var(--red)} .find.med{border-color:var(--ylw)} .find.low{border-color:var(--blu)}
.find .t{font-weight:800}
.find .sev{font-size:11px;font-weight:900;padding:2px 9px;border-radius:9px;margin-left:8px}
.high .sev{background:#3f1d1d;color:var(--red)} .med .sev{background:#3a2c10;color:var(--ylw)} .low .sev{background:#16283f;color:var(--blu)}
.find code{display:block;margin-top:6px;font-size:12px;color:var(--ylw);direction:ltr;text-align:left;white-space:pre-wrap}
.find .fx{margin-top:6px;font-size:12.5px;color:var(--grn)}
.find .ln{color:var(--mut);font-size:11.5px}
.okbox{background:#0e2a1d;border:1px solid var(--grn);border-radius:12px;padding:14px;margin:10px 0;font-size:13.5px}
footer{text-align:center;color:var(--mut);font-size:12.5px;padding:26px 16px;border-top:1px solid var(--line);line-height:1.9}
footer a{color:var(--grn)}
.adslot{max-width:1000px;margin:12px auto 0;padding:0 15px;text-align:center}
.adslot .ph{display:block;border:1px dashed var(--line);border-radius:10px;color:var(--mut);font-size:12px;padding:10px}
.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:12px}
.price{background:#0b0f1a;border:1px solid var(--grn);border-radius:14px;padding:20px;text-align:center}
.price .amt{font-size:32px;font-weight:900;color:var(--grn)}
.price ul{list-style:none;font-size:13px;margin:10px 0;line-height:2}
.price small{color:var(--mut)}
#payModal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:100;align-items:center;justify-content:center}
#payModal.show{display:flex}
#payBody{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(480px,92vw);max-height:88vh;overflow:auto}
.addrbox{background:#0b0f1a;border-radius:10px;padding:10px;font-family:monospace;font-size:12px;word-break:break-all;direction:ltr;margin:8px 0;color:var(--grn)}
.mrow{display:flex;gap:8px;margin:8px 0}
.mrow button{flex:1;background:transparent;color:var(--blu);border:1px solid var(--blu);border-radius:10px;padding:10px;cursor:pointer;font-weight:800}
.mrow button.on{background:var(--blu);color:#06121f}
#printArea{display:none}
@media print{body>*{display:none!important}#printArea{display:block!important}.pr-doc{font-family:Arial,sans-serif;color:#000}.pr-doc code{background:#eee;display:block;padding:8px;white-space:pre-wrap;font-size:12px}.pr-doc h2{margin:12px 0 6px}}
[dir="rtl"] input[type=text]{text-align:right}
@media(max-width:640px){.tabs button{font-size:12px}}
</style>

function norm(u){u=(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;return u;}
function parseHdr(text){const h={};(text||'').split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0){const k=l.slice(0,i).trim().toLowerCase(),v=l.slice(i+1).trim();if(k&&v)h[k]=h[k]?h[k]+'; '+v:v;}});return h;}
function analyze(h,url){
const g=k=>h[k]||'';
const out=[];
const isHttps=/^https:\/\//i.test(url||'');
out.push({id:'https',st:isHttps?'p':'f',w:0,detail:isHttps?'OK':url});
let s=100;
const put=(id,st,w,detail,fix)=>{out.push({id,st,w,detail,fix});if(st!=='p')s-=w;};
// HSTS
(()=>{const v=g('strict-transport-security');if(!v)return put('hsts','f',20,'missing','Strict-Transport-Security: max-age=63072000; includeSubDomains; preload');
const m=v.match(/max-age\s*=\s*(\d+)/i);const ma=m?+m[1]:0;
if(ma>=31536000){const extra=[];if(!/includesubdomains/i.test(v))extra.push('includeSubDomains?');if(!/preload/i.test(v))extra.push('preload?');
return put('hsts',extra.length?'w':'p',20,'max-age='+ma+(extra.length?' | '+extra.join(' '):''),'Strict-Transport-Security: max-age=63072000; includeSubDomains; preload');}
return put('hsts','w',20,'max-age='+ma+' (<31536000)','Strict-Transport-Security: max-age=63072000; includeSubDomains');})();
// CSP
(()=>{const v=g('content-security-policy');if(!v)return put('csp','f',20,'missing',"Content-Security-Policy: default-src 'self'");
const bad=[];if(/unsafe-inline/i.test(v))bad.push('unsafe-inline');if(/unsafe-eval/i.test(v))bad.push('unsafe-eval');if(/(default|script)-src[^;]*\*/.test(v))bad.push('wildcard');if(/data:/i.test(v))bad.push('data:');
return put('csp',bad.length?'w':'p',20,bad.length?bad.join(', '):'present',"Content-Security-Policy: default-src 'self'; object-src 'none'; base-uri 'self'");})();
// XFO
(()=>{const v=g('x-frame-options');if(!v)return put('xfo','f',10,'missing','X-Frame-Options: DENY');
if(/deny|sameorigin/i.test(v))return put('xfo','p',10,v,'X-Frame-Options: DENY');
return put('xfo','w',10,v,'X-Frame-Options: DENY');})();
// XCTO
(()=>{const v=g('x-content-type-options');if(!v)return put('xcto','f',10,'missing','X-Content-Type-Options: nosniff');
return put('xcto',/nosniff/i.test(v)?'p':'w',10,v,'X-Content-Type-Options: nosniff');})();
// Referrer
(()=>{const v=g('referrer-policy');if(!v)return put('ref','f',10,'missing','Referrer-Policy: strict-origin-when-cross-origin');
return put('ref',/unsafe-url/i.test(v)?'w':'p',10,v,'Referrer-Policy: strict-origin-when-cross-origin');})();
// Permissions
(()=>{const v=g('permissions-policy')||g('feature-policy');if(!v)return put('perm','f',10,'missing','Permissions-Policy: camera=(), microphone=(), geolocation=()');
return put('perm','p',10,v,'Permissions-Policy: camera=(), microphone=(), geolocation=()');})();
// COOP/COEP/CORP
(()=>{const a=g('cross-origin-opener-policy'),b=g('cross-origin-embedder-policy'),c=g('cross-origin-resource-policy');
if(a&&b)return put('coop','p',10,'COOP+COEP','Cross-Origin-Opener-Policy: same-origin');
if(a||b||c)return put('coop','w',10,[a,b,c].filter(Boolean).join(' | '),'Cross-Origin-Opener-Policy: same-origin');
return put('coop','f',10,'missing','Cross-Origin-Opener-Policy: same-origin');})();
// Leak
(()=>{const leaks=['server','x-powered-by','x-aspnet-version','x-aspnetmvc-version'].filter(k=>g(k));
if(!leaks.length)return put('leak','p',0,'hidden','(sunucu başlıklarını gizleyin)');
return put('leak','w',Math.min(10,leaks.length*5),leaks.map(k=>k+': '+g(k)).join(' | '),'(sunucu başlıklarını gizleyin)');})();
s=Math.max(0,s);
const grade=s>=90?'A+':s>=80?'A':s>=70?'B':s>=60?'C':s>=45?'D':'F';
return {checks:out,score:s,grade};
}
function renderH(r,url){
lastH={r,url};
const gc=r.grade[0]==='A'?'gA':r.grade==='B'?'gB':r.grade==='C'?'gC':'gF';
let h=`<div class="grade"><div class="badge ${gc}">${r.grade}</div><div><b>${t('gradeL')}: ${r.score}/100</b><br><small style="color:var(--mut)">${url}</small></div></div>`;
h+=r.checks.map(c=>{const cls=c.st==='p'?'p':c.st==='w'?'w':'f';
return `<div class="check"><div class="hd"><span class="dot ${cls}"></span>${t('c_'+c.id)} — ${t('st_'+c.st)}</div><small>${c.detail}</small>${c.fix?`<code>${t('fixL')}: ${c.fix}</code>`:''}</div>`;}).join('');
document.getElementById('hRes').innerHTML=h;
}

function mk(id,sev,line,code){return {id,sev,line,code};}
function audit(src){
const lines=src.split('\n'),F=[];
const hasGuard=/ReentrancyGuard|nonReentrant/.test(src);
const hasSafe=/SafeMath|using\s+SafeMath/.test(src);
lines.forEach((raw,i)=>{const ln=i+1,l=raw.trim();
if(!l||l.startsWith('//'))return;
let m;
if(m=l.match(/^pragma\s+solidity\s+([^;]+);?/)){const v=m[1].trim();const ver=v.match(/(\d+)\.(\d+)\.(\d+)/)||[];
if(/[\^<>]/.test(v))F.push(mk('pragma-float','med',ln,l));
if(ver.length&&+ver[1]===0&&+ver[2]<8&&!hasSafe)F.push(mk('old-solc','high',ln,l));}
if(/tx\.origin/.test(l))F.push(mk('txorigin','high',ln,l));
if(/\.call\s*(\{\s*value|\.value\s*\()/.test(l)||/\.call\.value\s*\(/.test(l))F.push(mk('reentrancy',hasGuard?'med':'high',ln,l));
if(/\.(send|call|delegatecall|callcode)\s*\(/.test(l)&&!/delegatecall/.test(l)&&!/require\s*\(|assert\s*\(|if\s*\(/.test(l))F.push(mk('unchecked','med',ln,l));
if(/delegatecall/.test(l))F.push(mk('delegatecall','high',ln,l));
if(/selfdestruct|suicide\s*\(/.test(l))F.push(mk('selfdestruct','high',ln,l));
if(/block\.timestamp|\bnow\b/.test(l))F.push(mk('timestamp','low',ln,l));
if(/function\s+mint\s*\(/.test(l)&&!/onlyOwner|onlyRole|AccessControl/i.test(l))F.push(mk('mint','high',ln,l));
if(/ecrecover\s*\(/.test(l))F.push(mk('ecrecover','med',ln,l));
});
if(!/constructor\s*\(/.test(src)){const cm=src.match(/function\s+([A-Z]\w*)\s*\(/);if(cm&&new RegExp('contract\\s+'+cm[1]).test(src))F.push(mk('old-ctor','med',1,cm[0].slice(0,60)));}
const pen={high:20,med:10,low:5};let s=100;F.forEach(f=>s-=pen[f.sev]);s=Math.max(0,s);
return {findings:F,score:s};
}

}`;

let lastAudit=null;
function fTx(id){const e=F_TXT[id]||{t:{},d:{},f:''};return {t:(e.t[lang]||e.t.en||id),d:(e.d[lang]||e.d.en||''),f:e.f||''};}
function fTxE(id){const e=F_TXT[id]||{t:{},d:{},f:''};return {t:(e.t.en||id),d:(e.d.en||''),f:e.f||''};}
function runAudit(){
const src=document.getElementById('codeIn').value;
if(!src.trim()){toast(t('needCode'));return;}
const r=audit(src);lastAudit=r;

let h=`<div class="grade"><div class="badge ${gc}">${r.score}</div><div><b>${t('verdict')}: ${r.findings.length} ${t('found')}</b></div></div>`;
if(!r.findings.length)h+=`<div class="okbox">${t('clean')}</div>`;
h+=r.findings.map(f=>{const tx=F_TXT[f.id][lang]||fTx(f.id);
return `<div class="find ${f.sev}"><span class="t">${tx.t}</span><span class="sev">${t('sev_'+f.sev)}</span><span class="ln"> · L${f.line}</span><div style="margin-top:4px">${tx.d}</div><code>${(f.code||'').slice(0,160)}</code><div class="fx">→ ${tx.f}</div></div>`;}).join('');
document.getElementById('cRes').innerHTML=h;
document.getElementById('dlBtn').style.display=r.findings.length?'inline-block':'none';
}
function dlReport(){

const b=new Blob([L.join('\n')],{type:'text/markdown'});const a=document.createElement('a');
a.href=URL.createObjectURL(b);a.download='hexshield-audit.md';a.click();
}

function isPro(k){try{return !!JSON.parse(localStorage.getItem('hs_pro_'+k)||'null');}catch(e){return false;}}
function buyPro(tool){

if(!hasScan){toast(t('needScan'));tab(tool==='headers'?'H':'C');return;}
payCtx={tool,price:CONFIG.prices[tool]};payMethod='btc';renderPay();

function renderPay(){
const p=payCtx;if(!p)return;const P=CONFIG.pay;
const usdt=[['USDT-TRC20',P.usdt_trc20],['USDT-ERC20',P.usdt_erc20]].filter(x=>x[1]);

if(payMethod==='btc'){h+=`<div class="addrbox">${P.btc}</div><img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent('bitcoin:'+P.btc)}" width="130" height="130" style="border-radius:10px;background:#fff;padding:6px" alt="QR"><div style="font-size:13px;margin-top:6px">≈ ${btcEq(p.price)} <small style="color:var(--mut)">· ${t('liveL')}</small> <button class="alt" onclick="copyTxt('${P.btc}')">${t('copied')}</button></div>`;}
else{const ad=usdt.find(u=>u[0]===payMethod)[1];h+=`<div class="addrbox">${ad}</div><div style="font-size:13px">$${p.price} ${payMethod}</div>`;}

function copyTxt(x){if(navigator.clipboard)navigator.clipboard.writeText(x).then(()=>toast(t('copied')));else toast(x);}
function unlockPro(){
const tx=((document.getElementById('payTx')||{}).value||'').trim();

try{localStorage.setItem('hs_pro_'+payCtx.tool,JSON.stringify({tx,time:new Date().toISOString()}));
const O=JSON.parse(localStorage.getItem('hs_orders')||'[]');O.unshift({tool:payCtx.tool,usd:payCtx.price,method:payMethod,tx,time:new Date().toLocaleString()});localStorage.setItem('hs_orders',JSON.stringify(O));}catch(e){}
try{tgSend('💎 HexShield PRO '+payCtx.tool+' $'+payCtx.price+' tx:'+(((document.getElementById('payTx')||{}).value)||'-'));}catch(e){}closePay();tab('P');openPro(payCtx.tool);toast(t('copied'));
}
function openPro(tool){
if(!isPro(tool)){tab('P');document.getElementById('proView').innerHTML='<div class="note">'+t('lockedMsg')+'</div>';return;}
const box=document.getElementById('proView');let h='';
if(tool==='headers'&&lastH){h=proHeaders(lastH);}else if(tool==='contract'&&lastAudit){h=proContract(lastAudit);}
else h='<div class="note">'+t('needScan')+'</div>';

box.scrollIntoView({behavior:'smooth',block:'nearest'});

function prio(h){const bad=h.checks.filter(c=>c.st!=='p').sort((a,b)=>b.w-a.w);
return bad.map((c,i)=>`<div class="check"><div class="hd"><span class="dot ${c.st==='f'?'f':'w'}"></span>#${i+1} ${t('c_'+c.id)} (−${c.w})</div><small>${c.detail}</small>${c.fix?`<code>${c.fix}</code>`:''}</div>`).join('')||'<div class="okbox">100/100 🎉</div>';}
function nginxConf(h){const m={};h.checks.forEach(c=>{if(c.st!=='p')m[c.id]=1;});let s='';
if(m.hsts)s+='add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;\n';
if(m.xfo)s+='add_header X-Frame-Options "DENY" always;\n';
if(m.xcto)s+='add_header X-Content-Type-Options "nosniff" always;\n';
if(m.ref)s+='add_header Referrer-Policy "strict-origin-when-cross-origin" always;\n';
if(m.perm)s+='add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;\n';
if(m.coop)s+='add_header Cross-Origin-Opener-Policy "same-origin" always;\n';
if(m.csp)s+='add_header Content-Security-Policy "default-src \'self\'; object-src \'none\'; base-uri \'self\'" always;\n';
return s||'# all headers present ✔';}
function proHeaders(o){const r=o.r;

function proContract(o){

const sec=(arr)=>arr.map(f=>{const tx=F_TXT[f.id][lang]||fTx(f.id);return `<div class="find ${f.sev}"><span class="t">${tx.t}</span><span class="ln"> · L${f.line}</span><div>${tx.d}</div><code>${(f.code||'').slice(0,160)}</code><div class="fx">→ ${tx.f}</div><div style="font-size:12px;color:var(--mut)">☑ ${t('verifyL')}: ${tx.t} — re-test + mainnet öncesi profesyonel denetim</div></div>`;}).join('');
return `<h3>💎 Contract Pro — ${t('verdict')}: ${o.score}/100</h3><p>🔴 ${by.high.length} · 🟡 ${by.med.length} · 🔵 ${by.low.length}</p>${sec(by.high)}${sec(by.med)}${sec(by.low)}`;
}
